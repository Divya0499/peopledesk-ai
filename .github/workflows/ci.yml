name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run still going for the old one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A throwaway database in the service container below. The name ends in
  # _test, which the test setup insists on before it deletes any rows.
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/peopledesk_test?schema=public
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/peopledesk_test?schema=public
  SESSION_SECRET: ci-secret-that-is-at-least-32-characters-long

jobs:
  checks:
    name: Lint, typecheck and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peopledesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peopledesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The tests use the runner's Google Chrome (channel: "chrome")
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
